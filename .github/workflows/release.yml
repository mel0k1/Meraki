name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64
          modules: qtshadertools
          cache: true
      - name: configure
        run: cmake -S engine/swinewm -B build -A x64 -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"
      - name: build
        run: cmake --build build --config Release -j
      - name: deploy
        shell: pwsh
        run: |
          $qtRoot = $env:QT_ROOT_DIR
          if (-not $qtRoot) { $qtRoot = $env:Qt6_DIR }
          $qtBin = Join-Path $qtRoot "bin"
          $out = "pack/Meraki"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build/Release/meraki.exe $out
          & (Join-Path $qtBin "windeployqt.exe") --release --no-translations `
            --qmldir engine/swinewm/swinewm/qml (Join-Path $out "meraki.exe")
          if (-not (Test-Path (Join-Path $out "platforms/qwindows.dll"))) {
            throw "qwindows.dll missing"
          }
          Copy-Item build/Release/switcher.exe, build/Release/swinemenu.exe, `
            build/Release/notify-send.exe, build/Release/makoctl.exe $out
          Copy-Item build/Release/config $out
          Copy-Item build/Release/waybar, build/Release/mako, `
            build/Release/wallpapers $out -Recurse
          Copy-Item pack/README.txt $out
          Copy-Item pack/widgets.example.json $out
          Compress-Archive -Path pack/Meraki/* `
            -DestinationPath "Meraki-$($env:GITHUB_REF_NAME)-x64.zip" -Force
      - name: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## Meraki $env:GITHUB_REF_NAME

          Тестовая сборка: DE в стиле MacShell на движке SwineWM.

          ### Что нового

          - Spotlight: пилюля поиска по центру экрана (Super+Space, а также
            иконка-лупа в ленте). Ищет приложения из меню «Пуск», числовое
            выражение считается калькулятором (2+2*10, (8-3)/4, 2^10);
            Enter копирует ответ в буфер обмена или запускает первое
            приложение, стрелки — выбор, Esc — закрыть.
          - Control Center: стеклянная панель с тайлами справа под лентой
            (иконка-тумблер в ленте или Super+Shift+S). Wi-Fi, Bluetooth и
            ночной свет открывают свои страницы Параметров; «Не беспокоить»
            — настоящий тумблер; ползунок громкости (клик и перетаскивание,
            колесо ±5%); медиа-кнопки SMTC; строка батареи.
          - «Не беспокоить» (DND): переключатель в шапке центра уведомлений
            и в Control Center (Super+Shift+D). Центр копит уведомления как
            обычно, но тосты не всплывают. Состояние хранится в
            settings.json.
          - Drag-реордер пинов в доке: потяните закреплённую иконку —
            остальные расступаются, отпускание запоминает порядок в
            dock.json (как в macOS).
          - Smart-hide дока: когда окно налегает на полосу дока, он
            уезжает за кромку; курсор у нижнего края (или ховер) вызывает
            его обратно. Рабочая область при скрытом доке расширяется
            автоматически. Отключается в settings.json:
            {"dock": {"smartHide": false}}.
          - Новые виджеты рабочего стола: «Система» — кольца ЦП и ОЗУ
            (обновление каждые 2 с, объём памяти в ГБ) и «Заметка» —
            липкий стикер с сохранением текста в ~/.swinewm/notes.txt.
            Оба перетаскиваются и настраиваются в widgets.json
            ("sys": {...}, "notes": {...}).

          ### Как попробовать

          1. Распакуйте архив в любую папку.
          2. Запустите `switcher.exe` и нажмите **«Поставить Meraki»** —
             оболочка сменится сразу, Meraki пропишется как shell пользователя
             (HKCU Winlogon, без прав администратора).
          3. Вернуть всё как было — кнопка **«Вернуть Explorer»** в том же
             switcher.exe.

          Быстрая проверка: Super+Space — Spotlight, наберите `12*34` и
          нажмите Enter; Super+Shift+S — Control Center; перетащите пин в
          доке; разверните окно на весь экран — док спрячется.

          Требования: Windows 10/11 x64. Исходники в engine/, детали порта —
          в docs/port.md.
          "@
          $notes | Out-File notes.md -Encoding utf8
          gh release create "$env:GITHUB_REF_NAME" `
            "Meraki-$($env:GITHUB_REF_NAME)-x64.zip" `
            --title "Meraki $env:GITHUB_REF_NAME" --notes-file notes.md
